<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Matchmaker" />
<meta name="theme-color" content="#0f172a" />
<link rel="apple-touch-icon" href="icon-matchmaker.png" />
<title>Matchmaker</title>
<style>
  html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  *, *::before, *::after { touch-action: manipulation; }
  button { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  :root { --bg: #0f172a; --card: #1e293b; --ink: #f1f5f9; --muted: #94a3b8; --acc: #f97316; --acc2: #22c55e; --line: #334155; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { margin: 6px 0 4px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea { width: 100%; min-height: 150px; resize: vertical; border-radius: 12px; border: 1px solid var(--line); background: #0b1220; color: var(--ink); padding: 12px; font-size: 16px; line-height: 1.4; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; background: #0b1220; border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 8px 10px; border-radius: 9px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--acc); color: #fff; }
  .seg.sp button.on { background: #334155; color: #fff; }
  body.drawing .seg, body.drawing #go, body.drawing #clear { opacity: .45; pointer-events: none; }
  input[type=number] { width: 70px; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: #0b1220; color: var(--ink); font-size: 16px; }
  .btn { border: 0; border-radius: 12px; padding: 12px 18px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn.sm { padding: 9px 12px; font-size: 16px; }
  .go { background: var(--acc); color: #fff; flex: 1; min-width: 160px; }
  .ghost { background: #0b1220; color: var(--ink); border: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .grp { background: #0b1220; border: 1px solid var(--line); border-radius: 12px; padding: 12px; animation: pop .35s ease both; }
  .grp h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); }
  .grp ul { list-style: none; margin: 0; padding: 0; }
  .grp li { padding: 6px 4px; border-top: 1px dashed var(--line); font-size: 17px; display: flex; align-items: center; gap: 8px; min-height: 36px; border-radius: 6px; }
  .grp li:first-child { border-top: 0; }
  .grp.bye { border-style: dashed; border-color: #64748b; }
  .grp.bye h3 { color: #94a3b8; }
  .grp.ord ul { counter-reset: o; }
  .grp.ord li::before { counter-increment: o; content: counter(o) "."; color: var(--muted); width: 24px; font-size: 14px; flex: none; }
  .ph { display: inline-block; height: 14px; width: 70%; border-radius: 7px; background: repeating-linear-gradient(90deg, #1e293b 0 8px, #273449 8px 16px); }
  li.flash { animation: flash .7s ease; }
  @keyframes flash { 0% { background: rgba(249,115,22,.5); } 100% { background: transparent; } }
  .vs { color: var(--muted); font-size: 13px; text-align: center; margin: 2px 0; }
  .note { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
  .err { color: #fca5a5; font-size: 14px; margin-top: 8px; min-height: 18px; }
  .count { color: var(--acc2); font-weight: 700; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  .dot { width: 16px; height: 16px; border-radius: 50%; flex: none; display: inline-block; box-shadow: inset -3px -3px 5px rgba(0,0,0,.4), inset 2px 2px 3px rgba(255,255,255,.35); }

  /* ---- draw stage (snooker-felt) ---- */
  .stage { position: sticky; top: 6px; z-index: 20; background: radial-gradient(ellipse at 50% 30%, #1f7a46, #0c3a22 72%); border: 1px solid #166534; border-radius: 16px; padding: 10px 12px 16px; margin-bottom: 14px; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  .stage[hidden] { display: none; }
  .stage.mini { padding: 10px 12px; }
  .stage.mini .reveal-area, .stage.mini .bowl-wrap { display: none; }
  .st-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; color: #dcfce7; font-weight: 700; }
  .st-top .pg { color: #86efac; font-weight: 600; font-size: 13px; margin-right: 8px; }
  .st-skip { background: rgba(0,0,0,.35); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 10px; padding: 8px 12px; font-weight: 700; font-size: 14px; }
  .reveal-area { height: 70px; display: flex; align-items: center; justify-content: center; }
  .reveal, .flyer { display: inline-flex; align-items: center; gap: 10px; background: #fff; color: #111; padding: 10px 18px; border-radius: 999px; font-size: 24px; font-weight: 800; box-shadow: 0 8px 24px rgba(0,0,0,.45); white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
  .reveal { transform: scale(.2); opacity: 0; transition: transform .28s cubic-bezier(.34,1.56,.64,1), opacity .18s; }
  .reveal.on { transform: scale(1); opacity: 1; }
  .reveal .dot, .flyer .dot { width: 22px; height: 22px; }
  .flyer { position: fixed; left: 0; top: 0; z-index: 60; transform-origin: 0 0; pointer-events: none; max-width: none; }
  .bowl-wrap { display: flex; justify-content: center; padding-top: 6px; }
  .bowl { position: relative; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, rgba(255,255,255,.25), rgba(255,255,255,.06) 42%, rgba(255,255,255,.02) 70%); border: 2px solid rgba(255,255,255,.4); box-shadow: inset 0 -14px 30px rgba(0,0,0,.35), 0 8px 18px rgba(0,0,0,.35); }
  .bowl::before { content: ""; position: absolute; left: 50%; top: -9px; width: 70px; height: 16px; transform: translateX(-50%); border-radius: 8px; background: #14532d; border: 2px solid rgba(255,255,255,.4); }
  .bowl.shake { animation: shake .16s linear infinite; }
  @keyframes shake { 0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-3px,1px) rotate(-2deg); } 50% { transform: translate(2px,-1px) rotate(1.5deg); } 75% { transform: translate(-1px,2px) rotate(-1deg); } 100% { transform: translate(0,0); } }
  .ball { position: absolute; left: 0; top: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; will-change: transform; box-shadow: inset -4px -5px 8px rgba(0,0,0,.45), 0 2px 3px rgba(0,0,0,.35); z-index: 2; }
  .ball i { font-style: normal; background: #fff; color: #111; border-radius: 50%; font-weight: 800; display: flex; align-items: center; justify-content: center; line-height: 1; }

  /* ---- knockout bracket ---- */
  .ko { overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
  .ko-in2 { width: max-content; }
  .ko-heads { display: flex; gap: 22px; margin: 0 2px 8px; }
  .ko-heads div { width: 124px; flex: none; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); font-weight: 700; }
  .ko-in { position: relative; display: flex; gap: 22px; padding: 0 2px; }
  .ko-col { display: flex; flex-direction: column; justify-content: space-around; width: 124px; flex: none; position: relative; z-index: 1; }
  .ko-m { height: 64px; background: #0b1220; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .ko-p { height: 31px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .ko-p + .ko-p { border-top: 1px solid var(--line); }
  .ko-p .dot { width: 12px; height: 12px; }
  .ko-p span.t { overflow: hidden; text-overflow: ellipsis; }
  .ko-p.tbd { color: #475569; cursor: default; }
  .ko-p.bye { color: #64748b; font-style: italic; font-size: 12px; cursor: default; }
  .ko-p.win, .ko-p.adv { color: var(--acc2); font-weight: 800; background: rgba(34,197,94,.1); }
  .ko-p.lose { color: #64748b; text-decoration: line-through; }
  .ko-p.flash { animation: flash .8s ease; }
  .ko-champ { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px; font-weight: 800; font-size: 14px; color: #fde68a; border-color: #a16207; text-align: center; }
  .ko-champ.won { background: rgba(250,204,21,.12); }
  .ko-svg { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; z-index: 0; }
  .chip { position: absolute; left: 0; top: 0; height: 31px; display: flex; align-items: center; gap: 6px; padding: 0 8px; font-size: 14px; font-weight: 800; background: #f8fafc; color: #0f172a; border-radius: 8px; z-index: 5; box-shadow: 0 4px 12px rgba(0,0,0,.45); white-space: nowrap; overflow: hidden; will-change: transform; }
  .chip .dot { width: 12px; height: 12px; }
  .ko-hint { color: var(--muted); font-size: 13px; margin: 8px 0 10px; }

  .lg-tbl { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
  .lg-tbl th { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 6px 4px; text-align: center; white-space: nowrap; }
  .lg-tbl td { padding: 8px 4px; border-top: 1px solid var(--line); text-align: center; }
  .lg-tbl th:nth-child(2), .lg-tbl td:nth-child(2) { text-align: left; width: 100%; }
  .lg-tbl td.pts { font-weight: 800; color: var(--acc); }
  .lg-tbl tr.top td { background: rgba(249,115,22,.08); }
  .lg-tbl .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; display: block; }
  .lg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .lg-head h2 { margin: 0; font-size: 18px; }
  .lg-prog { color: var(--muted); font-size: 13px; }
  .champ { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(34,197,94,.12); color: #86efac; font-weight: 700; }
  .rnd { background: #0b1220; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  .rnd.anim { animation: pop .4s ease both; }
  .rnd h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); }
  .fx { display: grid; grid-template-columns: 1fr 52px 10px 52px 1fr; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px dashed var(--line); }
  .fx:first-of-type { border-top: 0; }
  .fx .h { text-align: right; } .fx .a { text-align: left; }
  .fx .h, .fx .a { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx .win { color: var(--acc2); font-weight: 700; }
  .fx input { width: 52px; height: 44px; text-align: center; padding: 0; font-size: 18px; font-weight: 700; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .fx .dash { color: var(--muted); text-align: center; }
  .rnd .byeln { color: var(--muted); font-size: 14px; padding-top: 6px; border-top: 1px dashed var(--line); }
  select { padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: #0b1220; color: var(--ink); font-size: 16px; }
  #leagueOpt input[type=number] { width: 56px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--acc2); color: #04210f; padding: 10px 16px; border-radius: 10px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 70; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎲 Matchmaker</h1>
  <p class="sub">Type the usernames, then draw pairs, teams, a league or a knockout bracket.</p>

  <div class="card">
    <label for="names">Usernames <span id="count" class="count"></span></label>
    <textarea id="names" placeholder="One per line (or separated by commas)&#10;alex&#10;priya&#10;sam&#10;rahul"></textarea>
    <div class="hint">Duplicates and empty lines are ignored. If the numbers don&rsquo;t divide evenly, the extras get a bye. Your list is saved on this device.</div>
  </div>

  <div class="card">
    <div class="row">
      <div class="seg" role="tablist">
        <button id="mPairs" class="on">Pairs</button>
        <button id="mTeams">Teams</button>
        <button id="mLeague">League</button>
        <button id="mKO">Knockout</button>
      </div>
      <span id="teamOpt" style="display:none">
        <input id="teams" type="number" min="2" value="2" /> teams
      </span>
    </div>
    <div id="leagueOpt" class="row" style="display:none;margin-top:12px">
      <select id="legs"><option value="1">Play each other once</option><option value="2">Home &amp; away (twice)</option></select>
      <span>Win <input id="pWin" type="number" min="0" value="3" /></span>
      <span>Draw <input id="pDraw" type="number" min="0" value="1" /></span>
    </div>
    <div class="row" style="margin-top:12px">
      <div class="seg sp" id="speedSeg">
        <button data-sp="dramatic">🎬 Dramatic</button>
        <button data-sp="quick">⚡ Quick</button>
        <button data-sp="instant">Instant</button>
      </div>
      <button id="snd" class="btn ghost sm" aria-label="Sound">🔊</button>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="go" class="btn go">Draw!</button>
      <button id="copy" class="btn ghost">Copy</button>
      <button id="clear" class="btn ghost">Clear</button>
      <button id="resetBye" class="btn ghost">Reset byes</button>
    </div>
    <div id="err" class="err"></div>
  </div>

  <div id="stage" class="stage" hidden>
    <div class="st-top"><span id="stCap">Drawing…</span><span><span id="stProg" class="pg"></span><button id="stSkip" class="st-skip">Skip ⏭</button></span></div>
    <div class="reveal-area"><div id="reveal" class="reveal"></div></div>
    <div class="bowl-wrap"><div id="bowl" class="bowl"></div></div>
  </div>

  <div id="out" class="grid"></div>
  <div id="league"></div>
  <div id="ko"></div>
  <p id="note" class="note"></p>
</div>
<div id="toast">Copied!</div>

<script>
  const $ = (id) => document.getElementById(id);
  let mode = "pairs", last = [];
  const LS = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

  const names = () => {
    const seen = new Set(), out = [];
    $("names").value.split(/[\n,]+/).map((s) => s.trim()).filter(Boolean).forEach((n) => {
      const k = n.toLowerCase(); if (!seen.has(k)) { seen.add(k); out.push(n); }
    });
    return out;
  };
  const rnd = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // snooker-ball colours, one per name (stable by position in the list)
  const COLS = ["#c8102e", "#f2c300", "#0b7a3b", "#7a4a1f", "#1d4ed8", "#f06292", "#151515"];
  const colOf = (nm) => { const i = names().findIndex((x) => x.toLowerCase() === String(nm).toLowerCase()); return COLS[(i < 0 ? 0 : i) % COLS.length]; };
  const dot = (nm) => `<span class="dot" style="background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.55), rgba(255,255,255,0) 32%), ${colOf(nm)}"></span>`;
  const initials = (nm) => { const p = String(nm).replace(/^@/, "").trim(); return (p.length <= 2 ? p : p.slice(0, 2)).toUpperCase(); };

  // ---- feedback: haptics + tiny synthesised sounds ----
  function haptic() {
    try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
    try { const l = document.createElement("label"); l.style.display = "none"; const i = document.createElement("input"); i.type = "checkbox"; i.setAttribute("switch", ""); l.appendChild(i); document.head.appendChild(l); l.click(); l.remove(); } catch (e) {}
  }
  let AC = null, NOISE = null, soundOn = LS.get("mm-sound", "1") !== "0";
  function ensureAudio() {
    if (!soundOn) return;
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.resume) AC.resume();
      if (!NOISE) { NOISE = AC.createBuffer(1, Math.floor(AC.sampleRate * 0.03), AC.sampleRate); const d = NOISE.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3); }
    } catch (e) {}
  }
  function clack(vol = 0.05) {
    if (!soundOn || !AC || !NOISE) return;
    try { const s = AC.createBufferSource(); s.buffer = NOISE; s.playbackRate.value = 0.8 + Math.random() * 0.8; const f = AC.createBiquadFilter(); f.type = "bandpass"; f.frequency.value = 1800 + Math.random() * 1500; f.Q.value = 3; const g = AC.createGain(); g.gain.value = vol; s.connect(f).connect(g).connect(AC.destination); s.start(); } catch (e) {}
  }
  function tone(f0, f1, dur, type = "sine", vol = 0.12) {
    if (!soundOn || !AC) return;
    try { const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime; o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02); } catch (e) {}
  }
  const popS = () => tone(520, 1040, 0.09, "sine", 0.14);
  const tickS = (f) => tone(f, f * 0.9, 0.03, "square", 0.03);
  const dingS = () => { tone(880, 880, 0.5, "triangle", 0.08); setTimeout(() => tone(1320, 1320, 0.6, "triangle", 0.06), 90); };

  // ---- speed + skippable waits ----
  let speed = LS.get("mm-speed", "dramatic");
  const T = {
    dramatic: { shake1: 1100, shake: 600, mouth: 300, hold: 450, fly: 450, koSteps: 20, koMin: 70, koMax: 600, koFinal: 800 },
    quick: { shake1: 300, shake: 170, mouth: 160, hold: 120, fly: 280, koSteps: 10, koMin: 60, koMax: 300, koFinal: 450 },
  };
  let D = null; // the running draw
  const wait = (ms) => new Promise((res) => { if (!D || D.skip) return res(); const t = setTimeout(res, ms); D.timers.push(() => { clearTimeout(t); res(); }); });
  function beginDraw(kind) {
    D = { skip: false, timers: [] };
    document.body.classList.add("drawing");
    const st = $("stage"); st.hidden = false; st.classList.toggle("mini", kind !== "bowl");
    $("reveal").classList.remove("on"); $("stProg").textContent = "";
  }
  function endDraw() {
    stopPhysics(); $("stage").hidden = true; $("bowl").innerHTML = ""; $("bowl").classList.remove("shake");
    document.querySelectorAll(".flyer, .chip").forEach((e) => e.remove());
    document.body.classList.remove("drawing"); if (D) clearInterval(D.rattle); D = null;
  }
  function skipDraw() {
    if (!D) return; D.skip = true; clearInterval(D.rattle);
    D.timers.forEach((f) => f()); D.timers = [];
    document.querySelectorAll(".flyer, .chip").forEach((e) => e.remove());
  }
  $("stSkip").onclick = skipDraw;

  // ---- the bowl: balls bouncing in a glass bowl (simple physics) ----
  const PH = { balls: [], raf: 0, last: 0, shaking: false, R: 106, c: 110 };
  function setupBowl(list) {
    const bowl = $("bowl"); bowl.innerHTML = ""; PH.balls = [];
    const n = list.length, r = n <= 12 ? 17 : n <= 20 ? 14 : n <= 32 ? 11 : 9;
    list.forEach((nm) => {
      const el = document.createElement("div"); el.className = "ball";
      el.style.width = el.style.height = 2 * r + "px";
      el.style.background = `radial-gradient(circle at 32% 28%, rgba(255,255,255,.6), rgba(255,255,255,0) 30%), ${colOf(nm)}`;
      if (r >= 11) el.innerHTML = `<i style="width:${Math.round(r * 1.05)}px;height:${Math.round(r * 1.05)}px;font-size:${Math.max(7, Math.round(r * 0.5))}px">${esc(initials(nm))}</i>`;
      bowl.appendChild(el);
      const a = Math.random() * Math.PI, d = Math.random() * (PH.R - r) * 0.85;
      PH.balls.push({ nm, el, r, x: PH.c + Math.cos(a) * d, y: PH.c + Math.sin(a) * d, vx: (Math.random() - 0.5) * 60, vy: 0, free: true });
    });
    for (let i = 0; i < 60; i++) stepPhysics(1 / 60);
    PH.balls.forEach(place);
    stopPhysics(); PH.last = 0; PH.raf = requestAnimationFrame(loop);
  }
  const place = (b) => { b.el.style.transform = `translate(${b.x - b.r}px, ${b.y - b.r}px)`; };
  function stepPhysics(dt) {
    const g = 1200, R = PH.R, c = PH.c, bs = PH.balls.filter((b) => b.free);
    for (const b of bs) {
      b.vy += g * dt;

    for (let rr = r + 1, mm = m >> 1, R = Math.log2(ko.size); rr < R; rr++, mm >>= 1) delete ko.win[`${rr}-${mm}`]; // later results depended on this one
    saveKO(); haptic(); renderKO();
    const R = Math.log2(ko.size); if (r === R - 1 && ko.win[key] !== undefined) { ensureAudio(); dingS(); }
  }
  async function createKO() {
    const list = names(); $("err").textContent = "";
    if (list.length < 2) return fail("Add at least 2 names for a knockout.");
    if (ko && Object.keys(ko.win).length && !confirm("Start a new bracket? The current results will be wiped.")) return;
    ko = koDraw(list); saveKO();
    if (speed === "instant") { renderKO(); return; }
    beginDraw("mini"); $("stCap").textContent = "Shuffling the bracket…";
    renderKO({ blank: true });
    const inEl = $("koIn"); inEl.scrollIntoView({ block: "nearest" }); keepVisible(inEl.querySelector(".ko-m"));
    const slots = [...inEl.querySelector(".ko-col").querySelectorAll(".ko-p")]; // index = 2*match + side
    const real = ko.r1.map((x, i) => (x === null ? -1 : i)).filter((i) => i >= 0), players = ko.r1.filter((x) => x !== null);
    const w = slots[0].offsetWidth, chips = players.map((nm) => { const c = document.createElement("div"); c.className = "chip"; c.style.width = w + "px"; c.innerHTML = dot(nm) + esc(nm); inEl.appendChild(c); return c; });
    const ir = inEl.getBoundingClientRect(), pos = slots.map((s) => { const r = s.getBoundingClientRect(); return [r.left - ir.left, r.top - ir.top]; });
    const put = (c, i, ms, ease) => { c.style.transition = ms ? `transform ${ms}ms ${ease}` : "none"; c.style.transform = `translate(${pos[i][0]}px, ${pos[i][1]}px)`; };
    let perm = shuffle(real); chips.forEach((c, k) => put(c, perm[k], 0)); void inEl.offsetWidth;
    const t = T[speed], N = t.koSteps;
    for (let k = 0; k < N; k++) {
      if (D.skip) break;
      const lastStep = k === N - 1, iv = t.koMin + (t.koMax - t.koMin) * Math.pow(k / (N - 1), 2.2); // fast → slow to a halt
      perm = shuffle(real);
      chips.forEach((c, idx) => lastStep ? put(c, ko.r1.indexOf(players[idx]), t.koFinal, "cubic-bezier(.34,1.45,.64,1)") : put(c, perm[idx], Math.round(iv * 0.9), "cubic-bezier(.25,.8,.3,1)"));
      tickS(950 - (k / N) * 450);
      await wait(lastStep ? t.koFinal + 150 : iv);
    }
    endDraw(); renderKO(); dingS();
    $("koIn").querySelectorAll(".ko-col")[0].querySelectorAll(".ko-p:not(.bye)").forEach((el, i) => { el.style.animationDelay = i * 0.03 + "s"; el.classList.add("flash"); });
  }
  function koText() {
    const R = Math.log2(ko.size), rounds = resolve(), f = (x) => (x === undefined ? "TBD" : x), lines = ["🏆 Knockout"];
    rounds.forEach((rd, r) => {
      lines.push("", roundName(r, R));
      rd.forEach((mt) => lines.push(mt.a === null || mt.b === null ? `${f(mt.a === null ? mt.b : mt.a)} — bye` : `${f(mt.a)} vs ${f(mt.b)}${mt.w !== undefined ? " → " + winnerOf(mt) : ""}`));
    });
    const c = winnerOf(rounds[R - 1][0]); if (c) lines.push("", `Champion: ${c}`);
    return lines.join("\n");
  }

  // ---- modes, buttons, persistence ----
  const goLabel = () => (mode === "league" ? (league ? "New league 🔀" : "Draw the league") : mode === "knockout" ? (ko ? "New draw 🔀" : "Draw the bracket") : "Draw!");
  function setMode(m) {
    mode = m;
    [["mPairs", "pairs"], ["mTeams", "teams"], ["mLeague", "league"], ["mKO", "knockout"]].forEach(([id, k]) => $(id).classList.toggle("on", m === k));
    $("teamOpt").style.display = m === "teams" ? "inline" : "none"; $("leagueOpt").style.display = m === "league" ? "flex" : "none";
    $("resetBye").style.display = m === "league" ? "none" : "";
    $("out").innerHTML = ""; $("note").textContent = ""; $("err").textContent = ""; last = [];
    $("league").style.display = m === "league" ? "" : "none"; $("ko").style.display = m === "knockout" ? "" : "none";
    if (m === "league") renderLeague();
    if (m === "knockout") renderKO();
    $("go").textContent = goLabel();
    LS.set("mm-mode", m);
  }
  function setSpeed(s) { speed = T[s] || s === "instant" ? s : "dramatic"; document.querySelectorAll("#speedSeg button").forEach((b) => b.classList.toggle("on", b.dataset.sp === speed)); LS.set("mm-speed", speed); }
  function updateCount() { const n = names().length; $("count").textContent = n ? `(${n})` : ""; LS.set("mm-names", $("names").value); }

  $("mPairs").onclick = () => setMode("pairs");
  $("mTeams").onclick = () => setMode("teams");
  $("mLeague").onclick = () => setMode("league");
  $("mKO").onclick = () => setMode("knockout");
  document.querySelectorAll("#speedSeg button").forEach((b) => (b.onclick = () => setSpeed(b.dataset.sp)));
  $("snd").onclick = () => { soundOn = !soundOn; LS.set("mm-sound", soundOn ? "1" : "0"); $("snd").textContent = soundOn ? "🔊" : "🔇"; if (soundOn) { ensureAudio(); popS(); } };
  $("go").onclick = () => {
    if (D) return;
    ensureAudio(); haptic();
    if (mode === "league") createLeague(); else if (mode === "knockout") createKO(); else match();
  };
  $("names").oninput = updateCount;
  $("clear").onclick = () => { $("names").value = ""; updateCount(); if (mode !== "league" && mode !== "knockout") setMode(mode); };
  $("resetBye").onclick = () => { saveByes({}); LS.set("mm-kobyes", "{}"); $("toast").textContent = "Bye history reset"; $("toast").style.opacity = 1; setTimeout(() => { $("toast").style.opacity = 0; $("toast").textContent = "Copied!"; }, 1200); };
  $("copy").onclick = async () => {
    let txt;
    if (mode === "league") { if (!league) { $("err").textContent = "Draw a league first, then copy."; return; } txt = leagueText(); }
    else if (mode === "knockout") { if (!ko) { $("err").textContent = "Draw a bracket first, then copy."; return; } txt = koText(); }
    else { if (!last.length) return fail("Draw first, then copy."); txt = last.map((g) => `${g.title}: ${g.members.join(", ")}`).join("\n"); }
    try { await navigator.clipboard.writeText(txt); } catch (e) { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
    $("toast").style.opacity = 1; setTimeout(() => ($("toast").style.opacity = 0), 1200);
  };
  window.addEventListener("resize", () => { if (mode === "knockout" && ko && !D) drawLines(); });

  $("names").value = LS.get("mm-names", "");
  updateCount();
  league = loadLeague(); ko = loadKO();
  if (league) { $("legs").value = String(league.legs); $("pWin").value = league.win; $("pDraw").value = league.draw; }
  $("snd").textContent = soundOn ? "🔊" : "🔇";
  setSpeed(speed);
  setMode(LS.get("mm-mode", "pairs"));
</script>
<script>
  // no zoom: block pinch + double-tap zoom (iOS ignores user-scalable=no on its own)
  ["gesturestart", "gesturechange", "gestureend"].forEach((e) => document.addEventListener(e, (ev) => ev.preventDefault(), { passive: false }));
  let lastTouch = 0;
  // only text fields keep native double-tap (cursor/selection); sliders, buttons and gaps never zoom
  const isText = (el) => el.closest("textarea, select, input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=button])");
  document.addEventListener("touchend", (ev) => { const now = Date.now(); if (now - lastTouch < 350 && !isText(ev.target)) { ev.preventDefault(); (ev.target.closest("button") || ev.target.closest(".ko-p"))?.click(); } lastTouch = now; }, { passive: false });
  document.addEventListener("dblclick", (ev) => ev.preventDefault(), { passive: false });
  document.addEventListener("touchmove", (ev) => { if (ev.touches.length > 1) ev.preventDefault(); }, { passive: false });
</script>
</body>
</html>
