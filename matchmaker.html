<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Matchmaker" />
<meta name="theme-color" content="#0f172a" />
<link rel="apple-touch-icon" href="icon-matchmaker.png" />
<title>Matchmaker</title>
<style>
  html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  button, input, textarea, select { touch-action: manipulation; }
  button { -webkit-user-select: none; user-select: none; }
  :root { --bg: #0f172a; --card: #1e293b; --ink: #f1f5f9; --muted: #94a3b8; --acc: #f97316; --acc2: #22c55e; --line: #334155; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  .wrap { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { margin: 6px 0 4px; font-size: 28px; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  textarea { width: 100%; min-height: 150px; resize: vertical; border-radius: 12px; border: 1px solid var(--line); background: #0b1220; color: var(--ink); padding: 12px; font-size: 16px; line-height: 1.4; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; background: #0b1220; border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 8px 14px; border-radius: 9px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--acc); color: #fff; }
  input[type=number] { width: 70px; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: #0b1220; color: var(--ink); font-size: 16px; }
  .btn { border: 0; border-radius: 12px; padding: 12px 18px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .go { background: var(--acc); color: #fff; flex: 1; min-width: 160px; }
  .ghost { background: #0b1220; color: var(--ink); border: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .grp { background: #0b1220; border: 1px solid var(--line); border-radius: 12px; padding: 12px; animation: pop .35s ease both; }
  .grp h3 { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); }
  .grp ul { list-style: none; margin: 0; padding: 0; }
  .grp li { padding: 6px 0; border-top: 1px dashed var(--line); font-size: 17px; }
  .grp li:first-child { border-top: 0; }
  .grp.bye { border-style: dashed; border-color: #64748b; }
  .grp.bye h3 { color: #94a3b8; }
  .vs { color: var(--muted); font-size: 13px; text-align: center; margin: 2px 0; }
  .note { color: var(--muted); font-size: 14px; margin: 10px 0 0; }
  .err { color: #fca5a5; font-size: 14px; margin-top: 8px; min-height: 18px; }
  .count { color: var(--acc2); font-weight: 700; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.97); } to { opacity: 1; transform: none; } }
  .lg-tbl { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
  .lg-tbl th { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 6px 4px; text-align: center; white-space: nowrap; }
  .lg-tbl td { padding: 8px 4px; border-top: 1px solid var(--line); text-align: center; }
  .lg-tbl th:nth-child(2), .lg-tbl td:nth-child(2) { text-align: left; width: 100%; }
  .lg-tbl td.pts { font-weight: 800; color: var(--acc); }
  .lg-tbl tr.top td { background: rgba(249,115,22,.08); }
  .lg-tbl .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; display: block; }
  .lg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .lg-head h2 { margin: 0; font-size: 18px; }
  .lg-prog { color: var(--muted); font-size: 13px; }
  .champ { margin-top: 10px; padding: 10px 12px; border-radius: 12px; background: rgba(34,197,94,.12); color: #86efac; font-weight: 700; }
  .rnd { background: #0b1220; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-bottom: 10px; }
  .rnd h3 { margin: 0 0 6px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--acc); }
  .fx { display: grid; grid-template-columns: 1fr 52px 10px 52px 1fr; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px dashed var(--line); }
  .fx:first-of-type { border-top: 0; }
  .fx .h { text-align: right; } .fx .a { text-align: left; }
  .fx .h, .fx .a { font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fx .win { color: var(--acc2); font-weight: 700; }
  .fx input { width: 52px; height: 44px; text-align: center; padding: 0; font-size: 18px; font-weight: 700; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  .fx .dash { color: var(--muted); text-align: center; }
  .rnd .byeln { color: var(--muted); font-size: 14px; padding-top: 6px; border-top: 1px dashed var(--line); }
  select { padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: #0b1220; color: var(--ink); font-size: 16px; }
  #leagueOpt input[type=number] { width: 56px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--acc2); color: #04210f; padding: 10px 16px; border-radius: 10px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎲 Matchmaker</h1>
  <p class="sub">Type the usernames, then pick pairs, teams, or run a league.</p>

  <div class="card">
    <label for="names">Usernames <span id="count" class="count"></span></label>
    <textarea id="names" placeholder="One per line (or separated by commas)&#10;alex&#10;priya&#10;sam&#10;rahul"></textarea>
    <div class="hint">Duplicates and empty lines are ignored. If the numbers don&rsquo;t divide evenly, the extras get a bye. Your list is saved on this device.</div>
  </div>

  <div class="card">
    <div class="row">
      <div class="seg" role="tablist">
        <button id="mPairs" class="on">Pairs</button>
        <button id="mTeams">Teams</button>
        <button id="mLeague">League</button>
      </div>
      <span id="teamOpt" style="display:none">
        <input id="teams" type="number" min="2" value="2" /> teams
      </span>
    </div>
    <div id="leagueOpt" class="row" style="display:none;margin-top:12px">
      <select id="legs"><option value="1">Play each other once</option><option value="2">Home &amp; away (twice)</option></select>
      <span>Win <input id="pWin" type="number" min="0" value="3" /></span>
      <span>Draw <input id="pDraw" type="number" min="0" value="1" /></span>
    </div>
    <div class="row" style="margin-top:12px">
      <button id="go" class="btn go">Match!</button>
      <button id="copy" class="btn ghost">Copy</button>
      <button id="clear" class="btn ghost">Clear</button>
      <button id="resetBye" class="btn ghost">Reset byes</button>
    </div>
    <div id="err" class="err"></div>
  </div>

  <div id="out" class="grid"></div>
  <div id="league"></div>
  <p id="note" class="note"></p>
</div>
<div id="toast">Copied!</div>

<script>
  const $ = (id) => document.getElementById(id);
  let mode = "pairs", last = [];

  const names = () => {
    const seen = new Set(), out = [];
    $("names").value.split(/[\n,]+/).map((s) => s.trim()).filter(Boolean).forEach((n) => {
      const k = n.toLowerCase(); if (!seen.has(k)) { seen.add(k); out.push(n); }
    });
    return out;
  };
  const rnd = (n) => { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; };
  const shuffle = (arr) => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // ---- bye system: extras sit out; whoever has had the fewest byes so far is picked first (ties random)
  const loadByes = () => { try { return JSON.parse(localStorage.getItem("mm-byes") || "{}"); } catch (e) { return {}; } };
  const saveByes = (b) => { try { localStorage.setItem("mm-byes", JSON.stringify(b)); } catch (e) {} };
  function pickByes(list, n) {
    if (n <= 0) return { byes: [], rest: list };
    const b = loadByes(), order = shuffle(list).sort((x, y) => (b[x.toLowerCase()] || 0) - (b[y.toLowerCase()] || 0));
    const byes = order.slice(0, n); byes.forEach((x) => (b[x.toLowerCase()] = (b[x.toLowerCase()] || 0) + 1)); saveByes(b);
    return { byes, rest: list.filter((x) => !byes.includes(x)) };
  }
  function match() {
    const list = names(); $("err").textContent = ""; $("note").textContent = "";
    let size, label, groupsN;
    if (mode === "pairs") { if (list.length < 2) return fail("Add at least 2 usernames."); size = 2; label = "Pair"; groupsN = Math.floor(list.length / 2); }
    else {
      groupsN = Math.max(2, parseInt($("teams").value, 10) || 2);
      if (list.length < groupsN) return fail(`Need at least ${groupsN} usernames for ${groupsN} teams.`);
      size = Math.floor(list.length / groupsN); label = "Team";
    }
    const { byes, rest } = pickByes(list, list.length - groupsN * size);
    const s = shuffle(rest), groups = [];
    for (let i = 0; i < groupsN; i++) groups.push(s.slice(i * size, (i + 1) * size));
    render(groups, label, byes);
    if (byes.length) $("note").textContent = `${byes.length === 1 ? "1 person gets" : byes.length + " people get"} a bye this round. Byes rotate: whoever has had the fewest goes first.`;
  }
  function fail(msg) { $("err").textContent = msg; $("out").innerHTML = ""; last = []; }
  function render(groups, label, byes = []) {
    last = groups.map((g, i) => ({ title: `${label} ${i + 1}`, members: g }));
    if (byes.length) last.push({ title: "Bye", members: byes, bye: true });
    $("out").innerHTML = last.map((g, i) => `
      <div class="grp${g.bye ? " bye" : ""}" style="animation-delay:${i * 0.05}s"><h3>${g.bye ? "🛋️ Bye (sits out)" : g.title}</h3><ul>${
        g.members.map((m, j) => (!g.bye && label === "Pair" && j === 1 && g.members.length === 2 ? '<div class="vs">&</div>' : "") + `<li>${esc(m)}</li>`).join("")
      }</ul></div>`).join("");
    $("go").textContent = "Reshuffle 🔀";
  }
  const esc = (s) => s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  // ---- league: round robin (circle method), score entry, live standings
  let league = null;
  const loadLeague = () => { try { return JSON.parse(localStorage.getItem("mm-league") || "null"); } catch (e) { return null; } };
  const saveLeague = () => { try { localStorage.setItem("mm-league", JSON.stringify(league)); } catch (e) {} };
  function makeRounds(list, legs) {
    const arr = shuffle(list); if (arr.length % 2) arr.push(null);
    const n = arr.length, first = [];
    let a = arr.slice();
    for (let r = 0; r < n - 1; r++) {
      const rd = [];
      for (let i = 0; i < n / 2; i++) {
        let h = a[i], w = a[n - 1 - i];
        if ((i === 0 && r % 2) || (i > 0 && i % 2)) [h, w] = [w, h];
        if (h === null || w === null) rd.push({ bye: h === null ? w : h });
        else rd.push({ h, a: w, sh: "", sa: "" });
      }
      rd.sort((x, y) => (x.bye ? 1 : 0) - (y.bye ? 1 : 0));
      first.push(rd);
      a = [a[0], a[n - 1], ...a.slice(1, n - 1)];
    }
    const rounds = shuffle(first);
    if (legs === 2) rounds.push(...rounds.map((rd) => rd.map((m) => (m.bye ? { bye: m.bye } : { h: m.a, a: m.h, sh: "", sa: "" }))));
    return rounds;
  }
  function createLeague() {
    const list = names(); $("err").textContent = "";
    if (list.length < 2) return fail("Add at least 2 names for a league.");
    if (league && !confirm("Start a new league? The current fixtures and scores will be wiped.")) return;
    const legs = parseInt($("legs").value, 10) === 2 ? 2 : 1;
    const win = Math.max(0, parseInt($("pWin").value, 10) || 0), draw = Math.max(0, parseInt($("pDraw").value, 10) || 0);
    league = { entries: list, legs, win, draw, rounds: makeRounds(list, legs) };
    saveLeague(); renderLeague();
  }
  const played = (m) => !m.bye && m.sh !== "" && m.sa !== "";
  function standings() {
    const t = {};
    league.entries.forEach((e) => (t[e] = { name: e, p: 0, w: 0, d: 0, l: 0, f: 0, a: 0, pts: 0 }));
    league.rounds.flat().filter(played).forEach((m) => {
      const H = t[m.h], A = t[m.a], x = +m.sh, y = +m.sa;
      H.p++; A.p++; H.f += x; H.a += y; A.f += y; A.a += x;
      if (x > y) { H.w++; A.l++; H.pts += league.win; } else if (x < y) { A.w++; H.l++; A.pts += league.win; } else { H.d++; A.d++; H.pts += league.draw; A.pts += league.draw; }
    });
    return Object.values(t).sort((p, q) => q.pts - p.pts || (q.f - q.a) - (p.f - p.a) || q.f - p.f || q.w - p.w || p.name.localeCompare(q.name));
  }
  function renderTable() {
    const rows = standings(), all = league.rounds.flat().filter((m) => !m.bye), done = all.filter(played).length;
    const sd = (r) => (r.f - r.a > 0 ? "+" : "") + (r.f - r.a);
    let champ = "";
    if (done === all.length && all.length) {
      const top = rows.filter((r) => r.pts === rows[0].pts && r.f - r.a === rows[0].f - rows[0].a && r.f === rows[0].f && r.w === rows[0].w);
      champ = `<div class="champ">🏆 ${top.length > 1 ? "Tied at the top: " + top.map((r) => esc(r.name)).join(" & ") : "Champion: " + esc(rows[0].name)}</div>`;
    }
    $("lgTable").innerHTML = `<div class="lg-head"><h2>🏆 Table</h2><span class="lg-prog">${done}/${all.length} played · W${league.win} D${league.draw} L0</span></div>
      <table class="lg-tbl"><tr><th>#</th><th>Name</th><th>P</th><th>W</th><th>D</th><th>L</th><th>+/−</th><th>Pts</th></tr>${
        rows.map((r, i) => `<tr class="${i === 0 && done ? "top" : ""}"><td>${i + 1}</td><td><span class="nm">${esc(r.name)}</span></td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${sd(r)}</td><td class="pts">${r.pts}</td></tr>`).join("")
      }</table>${champ}`;
    league.rounds.forEach((rd, ri) => rd.forEach((m, mi) => {
      if (m.bye) return;
      const hs = document.querySelector(`[data-n="${ri}-${mi}"] .h`), as = document.querySelector(`[data-n="${ri}-${mi}"] .a`);
      if (!hs) return;
      hs.classList.toggle("win", played(m) && +m.sh > +m.sa); as.classList.toggle("win", played(m) && +m.sa > +m.sh);
    }));
  }
  function renderLeague() {
    if (!league) { $("league").innerHTML = ""; return; }
    const half = league.rounds.length / league.legs;
    $("league").innerHTML = `<div class="card" id="lgTable"></div>` + league.rounds.map((rd, ri) => `
      <div class="rnd"><h3>Round ${ri + 1}${league.legs === 2 ? (ri < half ? " · 1st leg" : " · 2nd leg") : ""}</h3>${
        rd.map((m, mi) => m.bye ? `<div class="byeln">🛋️ Bye: ${esc(m.bye)}</div>` :
          `<div class="fx" data-n="${ri}-${mi}"><span class="h">${esc(m.h)}</span><input inputmode="numeric" pattern="[0-9]*" data-k="sh" value="${m.sh}" aria-label="${esc(m.h)} score" /><span class="dash">–</span><input inputmode="numeric" pattern="[0-9]*" data-k="sa" value="${m.sa}" aria-label="${esc(m.a)} score" /><span class="a">${esc(m.a)}</span></div>`).join("")
      }</div>`).join("") + `<div class="row"><button id="lgNew" class="btn ghost">New league</button></div>`;
    $("league").querySelectorAll(".fx input").forEach((inp) => {
      inp.oninput = () => {
        const v = inp.value.replace(/\D/g, "").slice(0, 4); if (v !== inp.value) inp.value = v;
        const [ri, mi] = inp.parentElement.dataset.n.split("-").map(Number);
        league.rounds[ri][mi][inp.dataset.k] = v; saveLeague(); renderTable();
      };
    });
    $("lgNew").onclick = () => { if (!confirm("Delete this league and all its scores?")) return; league = null; saveLeague(); renderLeague(); $("go").textContent = "Create league"; };
    $("go").textContent = "New league 🔀";
    renderTable();
  }
  function leagueText() {
    const rows = standings(), lines = ["🏆 League table", ...rows.map((r, i) => `${i + 1}. ${r.name} — ${r.pts} pts (P${r.p} W${r.w} D${r.d} L${r.l}, ${r.f - r.a >= 0 ? "+" : ""}${r.f - r.a})`)];
    league.rounds.forEach((rd, ri) => {
      lines.push("", `Round ${ri + 1}`);
      rd.forEach((m) => lines.push(m.bye ? `Bye: ${m.bye}` : played(m) ? `${m.h} ${m.sh}–${m.sa} ${m.a}` : `${m.h} vs ${m.a}`));
    });
    return lines.join("\n");
  }

  function setMode(m) {
    mode = m; $("mPairs").classList.toggle("on", m === "pairs"); $("mTeams").classList.toggle("on", m === "teams"); $("mLeague").classList.toggle("on", m === "league");
    $("teamOpt").style.display = m === "teams" ? "inline" : "none"; $("leagueOpt").style.display = m === "league" ? "flex" : "none";
    $("resetBye").style.display = m === "league" ? "none" : "";
    $("go").textContent = "Match!"; $("out").innerHTML = ""; $("note").textContent = ""; $("err").textContent = ""; last = [];
    $("league").style.display = m === "league" ? "" : "none";
    if (m === "league") { $("go").textContent = league ? "New league 🔀" : "Create league"; renderLeague(); }
    try { localStorage.setItem("mm-mode", m); } catch (e) {}
  }
  function updateCount() { const n = names().length; $("count").textContent = n ? `(${n})` : ""; try { localStorage.setItem("mm-names", $("names").value); } catch (e) {} }

  $("mPairs").onclick = () => setMode("pairs");
  $("mTeams").onclick = () => setMode("teams");
  $("mLeague").onclick = () => setMode("league");
  $("go").onclick = () => (mode === "league" ? createLeague() : match());
  $("names").oninput = updateCount;
  $("clear").onclick = () => { $("names").value = ""; updateCount(); if (mode !== "league") setMode(mode); };
  $("resetBye").onclick = () => { saveByes({}); $("toast").textContent = "Bye history reset"; $("toast").style.opacity = 1; setTimeout(() => { $("toast").style.opacity = 0; $("toast").textContent = "Copied!"; }, 1200); };
  $("copy").onclick = async () => {
    let txt;
    if (mode === "league") { if (!league) { $("err").textContent = "Create a league first, then copy."; return; } txt = leagueText(); }
    else { if (!last.length) return fail("Match first, then copy."); txt = last.map((g) => `${g.title}: ${g.members.join(", ")}`).join("\n"); }
    try { await navigator.clipboard.writeText(txt); } catch (e) { const t = document.createElement("textarea"); t.value = txt; document.body.appendChild(t); t.select(); document.execCommand("copy"); t.remove(); }
    $("toast").style.opacity = 1; setTimeout(() => ($("toast").style.opacity = 0), 1200);
  };
  try { $("names").value = localStorage.getItem("mm-names") || ""; } catch (e) {}
  updateCount();
  league = loadLeague();
  if (league) { $("legs").value = String(league.legs); $("pWin").value = league.win; $("pDraw").value = league.draw; }
  setMode((() => { try { return localStorage.getItem("mm-mode") || "pairs"; } catch (e) { return "pairs"; } })());
</script>
<script>
  // no zoom: block pinch + double-tap zoom (iOS ignores user-scalable=no on its own)
  ["gesturestart", "gesturechange", "gestureend"].forEach((e) => document.addEventListener(e, (ev) => ev.preventDefault(), { passive: false }));
  let lastTouch = 0;
  document.addEventListener("touchend", (ev) => { const now = Date.now(); if (now - lastTouch < 350 && !ev.target.closest("input, textarea, select")) { ev.preventDefault(); ev.target.closest("button")?.click(); } lastTouch = now; }, { passive: false });
  document.addEventListener("touchmove", (ev) => { if (ev.touches.length > 1) ev.preventDefault(); }, { passive: false });
</script>
</body>
</html>
