<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Scoreboard" />
<meta name="theme-color" content="#5c2617" />
<link rel="apple-touch-icon" href="icon-scoreboard.png" />
<title>Score Board</title>
<style>
  html, body { touch-action: manipulation; -webkit-text-size-adjust: 100%; }
  *, *::before, *::after { touch-action: manipulation; }
  button { -webkit-user-select: none; user-select: none; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; min-height: 100vh; font-family: Georgia, "Times New Roman", serif; color: #2a1a0e;
         background: #3b1d12 radial-gradient(ellipse at 30% 20%, #6e2f1d 0%, #4a2216 45%, #2c130b 100%); }
  .board { max-width: 640px; margin: 0 auto; padding: 16px 12px 30px; }
  .player { background: linear-gradient(180deg, #7a3522, #5c2617); border: 3px solid #2a1209; border-radius: 14px; padding: 14px 14px 18px; margin-bottom: 14px;
            box-shadow: inset 0 2px 0 rgba(255,255,255,.08), 0 6px 16px rgba(0,0,0,.45); }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .name { flex: 1; background: linear-gradient(180deg, #f3dc8f, #c9a64a); border: 2px solid #8a6d22; border-radius: 6px; padding: 8px 10px;
          font: 700 18px Georgia, serif; color: #2a1a0e; text-align: center; outline: none; min-width: 0; }
  .frames { display: flex; align-items: center; gap: 4px; background: linear-gradient(180deg, #f3dc8f, #c9a64a); border: 2px solid #8a6d22; border-radius: 6px; padding: 4px 6px; font-weight: 700; }
  .frames span { min-width: 26px; text-align: center; font-size: 20px; }
  .frames small { font-size: 11px; letter-spacing: .05em; margin-right: 2px; }
  .mini { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #8a6d22; background: #e8c96a; font: 700 18px Georgia, serif; color: #2a1a0e; padding: 0; line-height: 1; }
  .row { display: flex; align-items: center; gap: 6px; }
  .big { flex: 1; min-width: 0; display: flex; justify-content: center; font: 700 clamp(44px, 14.5vw, 76px)/1 Georgia, serif; color: #f6e2a0; text-shadow: 0 3px 0 #2a1209, 0 0 18px rgba(246,226,160,.25); font-variant-numeric: tabular-nums; }
  /* odometer wheels: each digit is a drum of 0-9 twice, rolled with translateY */
  .dg { position: relative; display: inline-block; width: .62em; height: 1.12em; overflow: hidden; transition: width .35s ease, opacity .3s ease;
        -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 22%, #000 78%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 22%, #000 78%, transparent 100%); }
  .dg.off { width: 0; opacity: 0; }
  .strip { position: absolute; left: 0; right: 0; top: 0; display: flex; flex-direction: column; will-change: transform;
           transition: transform .55s cubic-bezier(.22,1.25,.36,1); }
  .strip.fast { transition-duration: .18s; transition-timing-function: ease-out; }
  .strip.snap { transition: none; }
  .strip span { height: 1.12em; line-height: 1.12em; text-align: center; }
  .big.bump { animation: bump .32s ease; }
  @keyframes bump { 40% { transform: scale(1.06); } }
  .pm { flex: none; width: clamp(54px, 15vw, 74px); height: clamp(54px, 15vw, 74px); border-radius: 50%; border: 3px solid #8a6d22; font: 700 clamp(22px, 6.5vw, 30px)/1 Georgia, serif; color: #2a1a0e; padding: 0;
        background: radial-gradient(circle at 35% 30%, #fff1b8, #d9b24f 55%, #9c7a24); box-shadow: 0 4px 0 #5a4210, 0 6px 12px rgba(0,0,0,.4); }
  .pm:active, .p3:active { transform: translateY(3px); box-shadow: 0 1px 0 #5a4210; }
  .p3 { flex: none; width: clamp(44px, 12vw, 60px); height: clamp(44px, 12vw, 60px); border-radius: 50%; border: 3px solid #8a6d22; font: 700 clamp(17px, 5vw, 22px)/1 Georgia, serif; color: #2a1a0e; padding: 0;
        background: radial-gradient(circle at 35% 30%, #fff1b8, #d9b24f 55%, #9c7a24); box-shadow: 0 3px 0 #5a4210, 0 5px 10px rgba(0,0,0,.4); }
  .rail { margin-top: 16px; position: relative; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(180deg, #fff3c4, #c9a64a 60%, #8a6d22); border: 1px solid #6b5418; }
  input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: linear-gradient(180deg, #fff3c4, #c9a64a 60%, #8a6d22); border: 1px solid #6b5418; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 34px; height: 38px; margin-top: -16px; border: 2px solid #6b5418; border-radius: 5px 5px 50% 50% / 5px 5px 60% 60%;
        background: radial-gradient(circle at 50% 35%, #fff6cf 0 18%, #e2bf5a 20%, #b8932f); box-shadow: 0 3px 6px rgba(0,0,0,.5); }
  input[type=range]::-moz-range-thumb { width: 30px; height: 34px; border: 2px solid #6b5418; border-radius: 5px 5px 50% 50%; background: #e2bf5a; }
  .scale { display: flex; justify-content: space-between; background: linear-gradient(180deg, #f3dc8f, #c9a64a); border: 2px solid #8a6d22; border-radius: 4px; padding: 3px 8px; font-size: 13px; font-weight: 700; }
  .lead { text-align: center; color: #f3dc8f; font-size: 15px; margin: 2px 0 12px; min-height: 18px; }
  .foot { display: flex; gap: 10px; }
  .foot button { flex: 1; border: 2px solid #8a6d22; border-radius: 10px; padding: 12px; font: 700 16px Georgia, serif; color: #2a1a0e; background: linear-gradient(180deg, #f3dc8f, #c9a64a); }
</style>
</head>
<body>
<div class="board">
  <div class="player" id="pl0"></div>
  <div class="lead" id="lead"></div>
  <div class="player" id="pl1"></div>
  <div class="foot"><button id="resetScores">New frame (scores to 0)</button><button id="resetAll">Reset all</button></div>
</div>
<script>
  const MAX = 160;
  let S;
  try { S = JSON.parse(localStorage.getItem("board")) || null; } catch (e) { S = null; }
  if (!S) S = { names: ["Player 1", "Player 2"], score: [0, 0], frames: [0, 0] };
  const save = () => { try { localStorage.setItem("board", JSON.stringify(S)); } catch (e) {} };
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function build(i) {
    document.getElementById("pl" + i).innerHTML = `
      <div class="top">
        <input class="name" id="n${i}" value="${esc(S.names[i])}" />
        <div class="frames"><small>FRAMES</small><button class="mini" data-f="${i}" data-d="-1">−</button><span id="f${i}">${S.frames[i]}</span><button class="mini" data-f="${i}" data-d="1">+</button></div>
      </div>
      <div class="row">
        <button class="pm" data-p="${i}" data-d="-1">−1</button>
        <button class="p3" data-p="${i}" data-d="-3">−3</button>
        <div class="big" id="s${i}">${[0,1,2].map(() => `<span class="dg"><span class="strip">${[...Array(20)].map((_, k) => `<span>${k % 10}</span>`).join("")}</span></span>`).join("")}</div>
        <button class="p3" data-p="${i}" data-d="3">+3</button>
        <button class="pm" data-p="${i}" data-d="1">+1</button>
      </div>
      <div class="rail"><input type="range" id="r${i}" min="0" max="${MAX}" value="${S.score[i]}" />
        <div class="scale"><span>0</span><span>20</span><span>40</span><span>60</span><span>80</span><span>100</span><span>120</span><span>140</span><span>160</span></div></div>`;
    document.getElementById("n" + i).oninput = (e) => { S.names[i] = e.target.value; save(); };
    document.getElementById("r" + i).oninput = (e) => { S.score[i] = +e.target.value; render("slide"); };
  }
  // wheel state: last shown digit per column, per player
  const shown = [null, null];
  function roll(i, mode) {
    const v = S.score[i], prev = shown[i], el = document.getElementById("s" + i);
    const cols = el.querySelectorAll(".dg"), digits = String(v).padStart(3, "0").split("").map(Number);
    const up = prev === null ? true : v >= prev;
    cols.forEach((col, k) => {
      const strip = col.firstElementChild, d = digits[k];
      col.classList.toggle("off", k < 2 && v < (k === 0 ? 100 : 10));
      strip.classList.toggle("fast", mode === "slide");
      const at = (pos, snap) => { strip.classList.toggle("snap", !!snap); strip.style.transform = `translateY(${-pos * 5}%)`; strip._pos = pos; if (snap) void strip.offsetHeight; };
      clearTimeout(strip._t);
      let cur = strip._pos ?? d;
      if (cur >= 10) { at(cur - 10, true); cur -= 10; }                       // finish a pending wrap first
      if (prev === null || mode === "slide" || mode === "reset") at(d, prev === null);
      else if (up && d < cur) { at(d + 10); strip._t = setTimeout(() => at(d, true), 600); }  // 9 -> 0 rolls forward
      else if (!up && d > cur) { at(cur + 10, true); at(d); }                             // 0 -> 9 rolls backward
      else at(d);
    });
    if (prev !== null && prev !== v && mode !== "slide") { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    shown[i] = v;
  }
  function render(mode) {
    for (const i of [0, 1]) {
      roll(i, mode);
      document.getElementById("r" + i).value = S.score[i];
      document.getElementById("f" + i).textContent = S.frames[i];
    }
    const d = S.score[0] - S.score[1];
    document.getElementById("lead").textContent = d === 0 ? "Level" : `${S.names[d > 0 ? 0 : 1] || "Player"} leads by ${Math.abs(d)}`;
    save();
  }
  // haptic tick: Android uses vibrate; iOS 18+ Safari gives a tick when a hidden <input switch> is toggled from a tap
  function haptic() {
    try {
      if (navigator.vibrate && navigator.vibrate(12)) return;
      const l = document.createElement("label"), c = document.createElement("input");
      l.ariaHidden = "true"; l.style.display = "none"; c.type = "checkbox"; c.setAttribute("switch", "");
      l.appendChild(c); document.head.appendChild(l); l.click(); l.remove();
    } catch (e) {}
  }
  build(0); build(1);
  document.body.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    haptic();
    if (b.dataset.p !== undefined) { const i = +b.dataset.p; S.score[i] = Math.max(0, Math.min(MAX, S.score[i] + +b.dataset.d)); render(); }
    if (b.dataset.f !== undefined) { const i = +b.dataset.f; S.frames[i] = Math.max(0, S.frames[i] + +b.dataset.d); render(); }
  });
  document.getElementById("resetScores").onclick = () => { if (confirm("Set both scores to 0?")) { S.score = [0, 0]; render("reset"); } };
  document.getElementById("resetAll").onclick = () => { if (confirm("Reset scores and frames?")) { S.score = [0, 0]; S.frames = [0, 0]; render("reset"); } };
  render();
</script>
<script>
  // no zoom: block pinch + double-tap zoom (iOS ignores user-scalable=no on its own)
  ["gesturestart", "gesturechange", "gestureend"].forEach((e) => document.addEventListener(e, (ev) => ev.preventDefault(), { passive: false }));
  let lastTouch = 0;
  // only text fields keep native double-tap (cursor/selection); sliders, buttons and gaps never zoom
  const isText = (el) => el.closest("textarea, select, input:not([type=range]):not([type=checkbox]):not([type=radio]):not([type=button])");
  document.addEventListener("touchend", (ev) => { const now = Date.now(); if (now - lastTouch < 350 && !isText(ev.target)) { ev.preventDefault(); ev.target.closest("button")?.click(); } lastTouch = now; }, { passive: false });
  document.addEventListener("dblclick", (ev) => ev.preventDefault(), { passive: false });
  document.addEventListener("touchmove", (ev) => { if (ev.touches.length > 1) ev.preventDefault(); }, { passive: false });
</script>
</body>
</html>
